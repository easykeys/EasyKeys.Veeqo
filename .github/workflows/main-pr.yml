name: "main PR CI"

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------- CHECKOUT ----------
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------- SETUP DOTNET ----------
      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
          include-prerelease: true

      # ---------- RESTORE ----------
      - name: Restore dependencies
        run: dotnet restore

      # ---------- CREATE / UPDATE BOT BRANCH ----------
      - name: Create or update bot fixes branch
        id: botbranch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          BOT_BRANCH="bot/fixes-pr-${PR_NUMBER}"

          echo "branch=$BOT_BRANCH" >> $GITHUB_OUTPUT

          git fetch origin "$PR_BRANCH"

          if git show-ref --verify --quiet refs/remotes/origin/$BOT_BRANCH; then
            git checkout "$BOT_BRANCH"
            git pull --ff origin "$BOT_BRANCH"
            git merge --ff "origin/$PR_BRANCH" || echo "Merge conflict ignored"
          else
            git checkout -b "$BOT_BRANCH" "origin/$PR_BRANCH"
          fi

      # ---------- LINT & AUTO-FIX ----------
      - name: Run dotnet format (apply fixes)
        id: lint
        run: |
          dotnet format --severity error > lint-result.txt || true
          cat lint-result.txt

      # ---------- CHECK FOR CHANGES ----------
      - name: Check for formatting changes
        id: changes
        run: |
          if git status --porcelain | grep .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # ---------- COMMIT & PUSH ----------
      - name: Commit and push lint fixes
        if: steps.changes.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: apply dotnet format fixes" || true

          # Ensure the push uses GITHUB_TOKEN
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin "${{ steps.botbranch.outputs.branch }}" --force-with-lease

      # ---------- CREATE / UPDATE BOT PR ----------
      - name: Create or update bot PR
        id: botpr
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.botbranch.outputs.branch }}
          base: ${{ github.event.pull_request.head.ref }}
          title: "chore: automated formatting fixes (PR #${{ github.event.pull_request.number }})"
          body: |
            🤖 **Automated formatting fixes**

            - `dotnet format` applied
            - Bot branch updated on latest PR changes
            - Safe to merge or cherry-pick

            Source PR: #${{ github.event.pull_request.number }}
          labels: |
            automated
            formatting
          allow-empty: true

      # ---------- PREPARE PR COMMENT ----------
      - name: Prepare PR comment body
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### 🧹 dotnet format results"
            echo
            echo "**Auto-fixes applied:** \`${{ steps.changes.outputs.changed }}\`"
            echo
            echo "**Bot branch:** \`${{ steps.botbranch.outputs.branch || 'n/a' }}\`"
            echo
            echo "**Bot PR:** ${{ steps.botpr.outputs.pull-request-url || 'n/a' }}"
            echo
            echo "<details>"
            echo "<summary>Lint output</summary>"
            echo

            if [ -f lint-result.txt ]; then
              echo '```'
              cat lint-result.txt
              echo '```'
            else
              echo "_No lint output available_"
            fi

            echo
            echo "</details>"
          } > pr-comment.md
        shell: /usr/bin/bash -e {0}

      # ---------- COMMENT ON ORIGINAL PR ----------
      - name: Comment on original PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-comment.md

      # ---------- BUILD ----------
      - name: Build
        run: dotnet build --no-restore

      # ---------- TEST ----------
      - name: Test
        run: dotnet test --no-build --verbosity normal
